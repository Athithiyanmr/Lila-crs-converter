services:
  geocrs-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: geocrs-api
    ports:
      - "8000:8000"

  geocrs-ui:
    build:
      context: .
      dockerfile: Dockerfile   # root Dockerfile
    container_name: geocrs-ui
    ports:
      - "8501:8501"
    depends_on:
      - geocrs-api